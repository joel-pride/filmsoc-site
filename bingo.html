<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo — FilmSoc</title>
  <meta name="theme-color" content="#16181d">
  <meta property="og:site_name" content="Southampton Film Society">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Bingo — Southampton Film Society">
  <meta property="og:description" content="A one-off film society bingo — generate your sheet and find members who fit each square.">
  <meta property="og:image" content="images/logo.png">
  <link rel="icon" type="image/png" sizes="96x96" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="bingo">

  <!-- No topbar/drawer here: this is the one public page (exempted from the
       gate in deploy/apache-site-template.conf), so during bingo night it
       must not link visitors into the still-password-protected site. -->
  <main class="page">
    <h1>Bingo</h1>
    <p class="lede">Generate your sheet, then find a member for every square.</p>

    <section class="bingo-intro" id="bingoIntro" aria-label="How bingo works">
      <p>
        Tap a square once you've found someone who fits it and put their name in it. First to fill all 9 squares wins!
      </p>

      <button class="bingo-generate" id="generateBtn" type="button">Generate bingo sheet</button>
    </section>

    <section class="bingo-board" id="bingoBoard" hidden aria-label="Your bingo sheet">
      <div class="bingo-grid" id="bingoGrid"></div>
      <p class="bingo-win" id="bingoWin" hidden>Full house!</p>
      <p class="bingo-hint">Tap a square and enter who fits it — fill all nine for a full house.</p>
      <button class="mini-btn bingo-reset" id="resetBtn" type="button">Start a new sheet</button>
    </section>
  </main>

  <div class="bingo-modal-backdrop" id="bingoModalBackdrop" hidden>
    <div class="bingo-modal" role="dialog" aria-modal="true" aria-labelledby="bingoModalTitle">
      <h2 class="bingo-modal-title" id="bingoModalTitle">Find someone…</h2>
      <p class="bingo-modal-square" id="bingoModalSquare"></p>
      <input class="bingo-modal-input" id="bingoNameInput" type="text" maxlength="40"
             placeholder="Their name" aria-label="Their name" autocomplete="off">
      <div class="bingo-modal-actions">
        <button class="mini-btn" id="bingoNameCancel" type="button">Cancel</button>
        <button class="submit-btn" id="bingoNameSave" type="button">Cross it off</button>
      </div>
    </div>
  </div>

  <footer class="site-footer"></footer>

  <!-- bingo.js only: no films.js/script.js, whose sole job here was the
       drawer — and films.js would publish the gated line-up. -->
  <script src="bingo.js"></script>
</body>
</html>
