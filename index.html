<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmSoc — Weekly Screenings</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">

  <header class="topbar">
    <button id="menuBtn" class="menu-btn" aria-label="Open menu" aria-controls="sideDrawer" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </header>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

  <nav class="drawer" id="sideDrawer" aria-label="Site navigation">
    <div class="drawer-head">
      <a class="brand" href="index.html">Film<span>Soc</span></a>
      <button class="drawer-close" id="drawerClose" aria-label="Close menu">&times;</button>
    </div>
    <ul class="drawer-links">
      <li><a href="index.html" data-nav="home">Home</a></li>
      <li><a href="about.html" data-nav="about">About Us</a></li>
      <li><a href="films.html" data-nav="films">Films Showings</a></li>
      <li><a href="find-us.html" data-nav="find-us">Where To Find Us</a></li>
    </ul>
    <div class="drawer-foot">
      <p>Films · Friends · Popcorn</p>
      <p class="drawer-foot-sub">Every Tuesday, 7pm</p>
    </div>
  </nav>

  <main class="home-main">
    <section class="carousel" aria-roledescription="carousel" aria-label="Weekly film showings">
      <button class="arrow" id="prevBtn" aria-label="Show previous films">&#8249;</button>

      <div class="stage">
        <div class="track" id="track"></div>
      </div>

      <button class="arrow" id="nextBtn" aria-label="Show next films">&#8250;</button>
    </section>

    <p class="hint">Click a poster to view the film on Letterboxd</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
