# filmsoc vhost — the stock php:8.3-apache default vhost with the password
# gate welded in. gate-entrypoint.sh copies this file over
# sites-available/000-default.conf on every container start, either filling
# in the cookie token or stripping the gate block (GATE_ENABLED=false).

<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	<Directory /var/www/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# Text assets revalidate before a cached copy may be used (cheap 304s
	# off Last-Modified). Without this browsers heuristic-cache CSS, and a
	# deployed styles.css change leaves returning visitors with new HTML
	# styled by the old sheet.
	<FilesMatch "\.(css|js|html?)$">
		Header set Cache-Control "no-cache"
	</FilesMatch>

	# GATE-BEGIN — removed by the entrypoint when the gate is switched off.
	# Everyone without the gate cookie (set by gate.php after the right
	# password) is bounced to the password page, with the original path
	# passed along so they land where they were heading once let in.
	RewriteEngine On
	RewriteCond %{REQUEST_URI} !^/gate\.php$
	RewriteCond %{HTTP_COOKIE} !(^|;\s*)filmsoc_gate=__GATE_TOKEN__(?:$|;)
	RewriteRule ^ /gate.php?to=%{REQUEST_URI} [R=302,L]
	# GATE-END

	# The gate's cookie secret and config.php must never be served.
	<Files ".gate-token">
		Require all denied
	</Files>
	<FilesMatch "^(config|config-sample)\.php$">
		Require all denied
	</FilesMatch>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
